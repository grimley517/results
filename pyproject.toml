[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swsc-racing-results-system"
version = "0.1.0"
authors = [
  { name="sprightlyManifesto", email="sprightlyManifesto@example.com" }, # Placeholder email
]
description = "SWSC racing results system for average lap Portsmouth Yardstick dinghy and catamaran racing."
readme = "readme.MD"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Sports :: Yachting",
    "Topic :: Software Development :: User Interfaces",
]
keywords = ["racing", "sailing", "results", "SWSC", "PyQt5", "tkinter"]

dependencies = [
    "PyQt5",
]

[project.urls]
"Homepage" = "https://github.com/sprightlyManifesto/results"
"Bug Tracker" = "https://github.com/sprightlyManifesto/results/issues"
